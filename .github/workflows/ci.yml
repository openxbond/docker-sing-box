name: CI

# 日常檢查：腳本靜態檢查、排程語義單測、單平台映像可建置。
# 映像發佈走 image.yml（僅 v* 標籤觸發）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck -S error entrypoint.sh build.sh

      - name: 排程語義測試
        run: tests/next-tick.test.sh

      - name: 映像可建置（單平台）
        run: |
          docker build \
            --build-arg SINGBOX_VERSION=v1.13.12 \
            -t docker-sing-box:check .
